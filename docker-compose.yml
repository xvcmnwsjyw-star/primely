# Local dev convenience: spins up MongoDB + the backend together.
# Frontend still runs separately with `npm run dev` (Vite has its own hot reload).
version: "3.8"
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/primely
      - JWT_SECRET=dev_secret_change_me
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - STRIPE_SECRET_KEY=sk_test_placeholder
      - STRIPE_WEBHOOK_SECRET=whsec_placeholder
    depends_on:
      - mongo
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  mongo_data:
